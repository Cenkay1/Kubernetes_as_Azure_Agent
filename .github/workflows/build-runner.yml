# Builds and pushes the GitHub Actions self-hosted runner image to GHCR.
# GitHub-side mirror of pipelines/build-agent.yml (Azure DevOps).
name: Build Runner Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag"
        required: false
        default: "latest"
  push:
    branches: [main]
    paths:
      - "images/github/**"
      - ".github/workflows/build-runner.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/githubkuberunner

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: images/github
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag || github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
