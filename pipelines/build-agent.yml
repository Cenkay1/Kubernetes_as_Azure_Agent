# Build & deploy Azure DevOps agent images to AKS.
#
# The selected variable group (goonly / nodeonly) MUST define:
#   buildPoolName                    - agent pool used to run THIS build pipeline
#   dockerRegistryServiceConnection  - ACR service connection name
#   imageRepository                  - image repository name (e.g. gokubeagent)
#   kubernetesConnection             - Kubernetes service connection name
#   CONTAINER_REGISTRY               - ACR login server (e.g. myacr.azurecr.io)
#   AGENT_POOL_NAME                  - Azure DevOps pool the agents register into
#   AZURE_DEVOPS_ORG_URL             - e.g. https://dev.azure.com/myorg
#   BASE64_ENCODED_PAT               - base64-encoded PAT (mark as secret)
trigger: none

parameters:
  - name: agentType
    displayName: "Select Agent Type to Build"
    type: string
    default: "go"
    values:
      - "go"
      - "node"

  - name: variableGroup
    displayName: "Variable Group"
    type: string
    default: "goonly"
    values:
      - "goonly"
      - "nodeonly"

variables:
  - group: ${{ parameters.variableGroup }}
  - name: IMAGE_TAG
    value: "$(Build.BuildId)-$(Build.SourceVersion)"

pool:
  name: $(buildPoolName)

stages:
  - stage: Build
    displayName: "Build & Push Agent Image"
    jobs:
      - job: BuildImage
        displayName: "Build ${{ parameters.agentType }} agent"
        steps:
          - script: |
              echo "Copying agent bootstrap script..."
              cp images/base/agent_installation.sh images/${{ parameters.agentType }}/agent_installation.sh
            displayName: "Copy shared scripts"

          - task: Docker@2
            displayName: "Build and push image"
            inputs:
              containerRegistry: "$(dockerRegistryServiceConnection)"
              repository: "$(imageRepository)"
              command: "buildAndPush"
              Dockerfile: "images/${{ parameters.agentType }}/Dockerfile"
              buildContext: "images/${{ parameters.agentType }}"
              tags: |
                $(IMAGE_TAG)
                latest

  - stage: Deploy
    displayName: "Deploy to AKS"
    dependsOn: Build
    jobs:
      - job: DeployAgent
        displayName: "Deploy ${{ parameters.agentType }} agent"
        steps:
          # Manifests use <PLACEHOLDER> tokens, so a custom prefix/suffix is required.
          - task: replacetokens@6
            displayName: "Replace tokens in manifests"
            inputs:
              root: "k8s"
              sources: |
                base/secret.yml
                ${{ parameters.agentType }}/deployment.yml
              tokenPattern: "custom"
              tokenPrefix: "<"
              tokenSuffix: ">"
              missingVarLog: "error"

          - task: Kubernetes@1
            displayName: "Apply base resources"
            inputs:
              connectionType: "Kubernetes Service Connection"
              kubernetesServiceEndpoint: "$(kubernetesConnection)"
              command: "apply"
              useConfigurationFile: true
              configuration: "k8s/base/"

          - task: Kubernetes@1
            displayName: "Apply agent deployment"
            inputs:
              connectionType: "Kubernetes Service Connection"
              kubernetesServiceEndpoint: "$(kubernetesConnection)"
              command: "apply"
              useConfigurationFile: true
              configuration: "k8s/${{ parameters.agentType }}/deployment.yml"
