trigger:
  - main

pool:
  name: <AGENT_POOL_NAME>
  demands:
    - TAG_VALUE -equals goonly

steps:
  - script: |
      echo "Agent is running successfully!"
      echo "Go version:   $(go version)"
      echo "Node version: $(node --version)"
      echo "kubectl:      $(kubectl version --client -o yaml | grep gitVersion | head -n1 | awk '{print $2}')"
    displayName: "Verify agent capabilities"
