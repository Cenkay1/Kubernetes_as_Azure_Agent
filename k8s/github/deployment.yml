apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: github-auth
  namespace: azure-agents
  labels:
    app.kubernetes.io/part-of: azure-devops-agents
data:
  # echo -n "your-github-pat" | base64
  personalAccessToken: "<BASE64_ENCODED_GH_PAT>"
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: github-trigger-auth
  namespace: azure-agents
spec:
  secretTargetRef:
    - parameter: personalAccessToken
      name: github-auth
      key: personalAccessToken
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner
  namespace: azure-agents
  labels:
    app.kubernetes.io/name: github-runner
    app.kubernetes.io/part-of: azure-devops-agents
    app.kubernetes.io/component: runner
spec:
  replicas: 1
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      app: github-runner
  template:
    metadata:
      labels:
        app: github-runner
        runner-type: github
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: github-runner
          image: <CONTAINER_REGISTRY>/githubkuberunner:<IMAGE_TAG>
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          env:
            - name: GITHUB_SERVER_URL
              value: "https://github.com"
            - name: GITHUB_API_URL
              value: "https://api.github.com"
            - name: RUNNER_SCOPE
              value: "org"
            - name: GH_OWNER
              value: "<GITHUB_OWNER>"
            - name: RUNNER_LABELS
              value: "<RUNNER_LABELS>"
            - name: EPHEMERAL
              value: "true"
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-auth
                  key: personalAccessToken
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - "pgrep -f 'Runner.Listener' > /dev/null"
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - "pgrep -f 'Runner.Listener' > /dev/null"
            initialDelaySeconds: 90
            periodSeconds: 15
      imagePullSecrets:
        - name: acr-secret
      nodeSelector:
        pool: agent
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: github-runner-scaledobject
  namespace: azure-agents
spec:
  scaleTargetRef:
    name: github-runner
  minReplicaCount: 0
  maxReplicaCount: 10
  cooldownPeriod: 300
  pollingInterval: 15
  triggers:
    - type: github-runner
      metadata:
        owner: "<GITHUB_OWNER>"
        runnerScope: "org"
        labels: "<RUNNER_LABELS>"
        targetWorkflowQueueLength: "1"
      authenticationRef:
        name: github-trigger-auth
