{{- if .Values.github.enabled }}
{{- range $name, $runner := .Values.github.runners }}
{{- if $runner.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "azure-devops-agent.fullname" $ }}-github-{{ $name }}
  labels:
    {{- include "azure-devops-agent.labels" $ | nindent 4 }}
    app.kubernetes.io/component: github-{{ $name }}-runner
spec:
  replicas: {{ $.Values.scaling.minReplicaCount }}
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      app: {{ include "azure-devops-agent.fullname" $ }}-github-{{ $name }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/github-secret.yaml") $ | sha256sum }}
      labels:
        app: {{ include "azure-devops-agent.fullname" $ }}-github-{{ $name }}
        runner-type: github-{{ $name }}
    spec:
      terminationGracePeriodSeconds: {{ $.Values.terminationGracePeriodSeconds }}
      containers:
        - name: runner
          image: "{{ $.Values.image.registry }}/{{ $runner.image }}:{{ $runner.tag }}"
          resources:
            {{- toYaml $runner.resources | nindent 12 }}
          env:
            - name: GITHUB_SERVER_URL
              value: {{ $.Values.github.url | quote }}
            - name: GITHUB_API_URL
              value: {{ $.Values.github.apiUrl | quote }}
            - name: RUNNER_SCOPE
              value: {{ $.Values.github.runnerScope | quote }}
            - name: GH_OWNER
              value: {{ $.Values.github.owner | quote }}
            {{- if $.Values.github.repos }}
            - name: GH_REPOSITORY
              value: {{ $.Values.github.repos | quote }}
            {{- end }}
            - name: RUNNER_LABELS
              value: {{ $runner.labels | quote }}
            - name: EPHEMERAL
              value: {{ $.Values.github.ephemeral | quote }}
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "azure-devops-agent.githubSecretName" $ }}
                  key: personalAccessToken
          livenessProbe:
            exec:
              command: ["/bin/bash", "-c", "pgrep -f 'Runner.Listener' > /dev/null"]
            initialDelaySeconds: {{ $.Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ $.Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ $.Values.probes.liveness.failureThreshold }}
          readinessProbe:
            exec:
              command: ["/bin/bash", "-c", "pgrep -f 'Runner.Listener' > /dev/null"]
            initialDelaySeconds: {{ $.Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ $.Values.probes.readiness.periodSeconds }}
      {{- with $.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
{{- end }}
