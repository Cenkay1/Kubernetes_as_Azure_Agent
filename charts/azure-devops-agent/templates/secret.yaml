apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "azure-devops-agent.secretName" . }}
  labels:
    {{- include "azure-devops-agent.labels" . | nindent 4 }}
data:
  personalAccessToken: {{ .Values.azureDevOps.pat | b64enc | quote }}
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "azure-devops-agent.triggerAuthName" . }}
  labels:
    {{- include "azure-devops-agent.labels" . | nindent 4 }}
spec:
  secretTargetRef:
    - parameter: personalAccessToken
      name: {{ include "azure-devops-agent.secretName" . }}
      key: personalAccessToken
