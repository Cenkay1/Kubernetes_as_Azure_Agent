# Azure DevOps configuration
azureDevOps:
  url: ""              # https://dev.azure.com/myorg
  pat: ""              # Personal Access Token (plain text - will be base64 encoded by Helm)
  poolName: ""         # Agent pool name

# Container registry
image:
  registry: ""         # myacr.azurecr.io
  pullSecrets:
    - name: acr-secret

# Agent types to deploy
agents:
  go:
    enabled: true
    image: gokubeagent
    tag: latest
    tagValue: "goonly"
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "2"
        memory: "2Gi"

  node:
    enabled: false
    image: nodekubeagent
    tag: latest
    tagValue: "nodeonly"
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "2"
        memory: "2Gi"

# GitHub Actions self-hosted runners (parallel to the Azure DevOps agents above).
# Disabled by default; enable to deploy KEDA-autoscaled ephemeral runners.
github:
  enabled: false
  url: "https://github.com"        # GHES: https://github.mycompany.com
  apiUrl: "https://api.github.com" # GHES: https://github.mycompany.com/api/v3
  owner: ""                         # org login (or user/repo owner)
  runnerScope: "org"               # org | repo | ent
  repos: ""                         # required when runnerScope=repo
  pat: ""                           # GitHub PAT (plain text - base64 encoded by Helm)
  ephemeral: true                   # one job per runner, then recycle
  runners:
    default:
      enabled: true
      image: githubkuberunner
      tag: latest
      labels: "self-hosted,linux,k8s"
      resources:
        requests:
          cpu: "500m"
          memory: "512Mi"
        limits:
          cpu: "2"
          memory: "2Gi"

# KEDA autoscaling
scaling:
  minReplicaCount: 0
  maxReplicaCount: 10
  cooldownPeriod: 300
  pollingInterval: 15

# Pod configuration
nodeSelector:
  pool: agent

terminationGracePeriodSeconds: 120

# Health checks
probes:
  liveness:
    initialDelaySeconds: 120
    periodSeconds: 30
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 90
    periodSeconds: 15
